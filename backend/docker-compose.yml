# Только для локальной разработки. Читает переменные из .env рядом с файлом.
# Нужны: DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_ROOT_PASSWORD

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: PR_app_dev
        working_dir: /var/www
        restart: unless-stopped
        volumes:
            - .:/var/www
        env_file:
            - .env
        environment:
            - DB_HOST=db
            - DB_PORT=3306
        depends_on:
            db:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        container_name: PR_nginx_dev
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
            - reverb

    db:
        image: mysql:8.4
        container_name: pr_searching_dev
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        # только с самого хоста
        ports:
            - "127.0.0.1:3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan reverb:start
        working_dir: /var/www
        restart: unless-stopped
        volumes:
            - .:/var/www
        env_file:
            - .env
        environment:
            - DB_HOST=db
            - DB_PORT=3306
        # для разработки открыт только на localhost хоста
        ports:
            - "127.0.0.1:6001:6001"
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_started

volumes:
    db_data: