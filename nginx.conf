events {
    worker_connections 1024; # Максимальное количество подключений на одного воркера
}

http {
    upstream backend {
        server PR_backend:9000; # PHP-FPM (Laravel)
    }

    upstream frontend {
        server frontend:3000;   # Фронтенд
    }

    server {
        listen 80;
        server_name 203.0.113.10;


         root /var/www/public;
         index index.php index.html;


         location /docs/asset/ {
             alias /var/www/public/vendor/swagger-api/swagger-ui/dist/;
             access_log off;
             expires 30d;
         }
        # ---------------------------------
        # Настройки для фронтенда
        # ---------------------------------
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------
        # Прокси для WebSocket Laravel Reverb
        # ---------------------------------
        location /app {
            proxy_pass http://reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # ---------------------------------
        # Настройки для API Laravel
        # ---------------------------------
        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

            fastcgi_pass backend;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $uri;
        }

        # ---------------------------------
        # Sanctum
        # ---------------------------------
        location /sanctum/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "http://localhost:3000" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

            fastcgi_pass backend;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $uri;
        }

        # ---------------------------------
        # Логи
        # ---------------------------------




        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}
