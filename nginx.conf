events {
    worker_connections 1024;
}

http {
    upstream backend {
        server PR_backend:9000; # PHP-FPM (Laravel)
    }

    upstream frontend {
        server frontend:3000;   # Фронтенд
    }

    server {
        listen 80;
        server_name localhost;

        root /var/www/public;
        index index.php index.html;

        # ---------------------------------
        # Swagger UI ассеты
        # ---------------------------------
        location /vendor/ {
            alias /var/www/public/vendor/;
            access_log off;
            expires 30d;
        }

        # ---------------------------------
        # Фронтенд (если он доступен через этот контейнер)
        # ---------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;

            # CORS для фронта
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        }

        # ---------------------------------
        # Прокси для WebSocket Laravel Reverb
        # ---------------------------------
        location /app {
            proxy_pass http://reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # ---------------------------------
        # API Laravel
        # ---------------------------------
        location ~ ^/(api|sanctum)/ {
            try_files $uri $uri/ /index.php?$query_string;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        }

        # ---------------------------------
        # PHP обработка
        # ---------------------------------
        location ~ \.php$ {
            fastcgi_pass backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ---------------------------------
        # Логи
        # ---------------------------------
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}
